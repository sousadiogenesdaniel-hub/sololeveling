// repo1.maven.org é o mesmo Maven Central (espelho oficial); usado porque repo.maven.apache.org às vezes limita pedidos
pluginManagement {
    repositories { google(); maven { url 'https://repo1.maven.org/maven2/' }; mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); maven { url 'https://repo1.maven.org/maven2/' }; mavenCentral() }
}
rootProject.name = "OSistema"
include ':app'
